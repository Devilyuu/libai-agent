<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>和李白聊一聊</title>
<style>
  /* 网页智能体：打开就能聊。人物设定在 agent.js；大模型的钥匙点右上角齿轮填一次，存在这台电脑的浏览器里。
     1rem 随画面大小缩放，放进 PPT 的网页框里也够大。 */
  @font-face { font-family: "WenKai"; src: url(wenkai.woff2) format("woff2"); font-display: swap; }
  @font-face { font-family: "MaShan"; src: url(mashan.woff2) format("woff2"); font-display: swap; }
  :root { --paper: #f7f0e1; --paper2: #efe4cc; --ink: #2a2118; --ink2: #6b5a45; --red: #b8322a; --red-rgb: 184,50,42;
          --blue: #3d5a9e; --gold: #e2a64a; --ui: "WenKai", "KaiTi", "STKaiti", "楷体", serif; }
  * { box-sizing: border-box; }
  html { font-size: clamp(14px, 2.6vh, 32px); }
  @media (max-aspect-ratio: 16/10) { html { font-size: clamp(14px, 1.6vw, 32px); } }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font-family: var(--ui); color: var(--ink); background: #1d1a2b url(bg.jpg) center / cover no-repeat; }
  button, input, select, textarea { font-family: var(--ui); }
  button { cursor: pointer; }

  .shade { position: fixed; inset: 0; pointer-events: none;
           background: linear-gradient(90deg, rgba(20,14,30,.05) 0%, rgba(20,14,30,.25) 40%, rgba(20,14,30,.55) 100%); }

  /* 左侧：人物牌 */
  .who { position: fixed; left: 2.2rem; top: 2rem; display: flex; align-items: center; gap: 1rem; color: #fff; z-index: 2; }
  .seal { width: 4.2rem; height: 4.2rem; flex: none; border-radius: 1rem; background: var(--red); color: #fff3e6;
          display: flex; align-items: center; justify-content: center; font-family: "MaShan", var(--ui); font-size: 2.9rem;
          line-height: 1; box-shadow: inset 0 0 0 .2rem rgba(255,235,210,.55), 0 .4rem 1.2rem rgba(60,10,10,.45);
          transform: rotate(-4deg); }
  .who b { display: block; font-family: "MaShan", var(--ui); font-weight: 400; font-size: 2.6rem; letter-spacing: .12em;
           text-shadow: 0 .15rem .8rem rgba(20,5,30,.7); line-height: 1.15; }
  .who span { display: inline-block; margin-top: .3rem; font-size: .95rem; padding: .15rem .7rem; border-radius: 1rem;
              background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.35); }
  .poem { position: fixed; left: 2.4rem; bottom: 2.2rem; color: #fff; z-index: 1; writing-mode: vertical-rl;
          font-size: 1.35rem; letter-spacing: .25em; line-height: 2.1; text-shadow: 0 .1rem .6rem rgba(10,0,20,.85); }

  /* 右侧：宣纸对话卷 */
  .scroll { position: fixed; top: 1.6rem; bottom: 1.6rem; right: 1.8rem; width: min(60vw, 52rem); z-index: 3;
            display: flex; flex-direction: column; border-radius: 1.4rem; overflow: hidden;
            background: linear-gradient(180deg, rgba(250,244,230,.97), rgba(243,233,212,.97));
            box-shadow: 0 1.5rem 4rem rgba(15,5,25,.55), inset 0 0 0 1px rgba(120,90,50,.25); }
  .scroll::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
            background: repeating-linear-gradient(90deg, rgba(150,120,80,.035) 0 2px, transparent 2px 7px),
                        radial-gradient(ellipse at 20% 0%, rgba(255,255,255,.6), transparent 60%); }
  .bar { position: relative; display: flex; align-items: center; justify-content: space-between; padding: .8rem 1.4rem;
         border-bottom: 1px dashed rgba(120,90,50,.35); color: var(--ink2); font-size: 1rem; }
  .bar .live { display: flex; align-items: center; gap: .5rem; }
  .dot { width: .6rem; height: .6rem; border-radius: 50%; background: #3fa66b; box-shadow: 0 0 0 .2rem rgba(63,166,107,.2); }
  .dot.off { background: #c9a227; box-shadow: 0 0 0 .2rem rgba(201,162,39,.2); }
  .gear { border: 0; background: none; color: var(--ink2); font-size: 1.3rem; opacity: .45; padding: .2rem .4rem; }
  .gear:hover { opacity: 1; }

  #log { position: relative; flex: 1; overflow-y: auto; padding: 1.2rem 1.4rem .6rem; scroll-behavior: smooth; }
  .msg { display: flex; gap: .8rem; margin: 0 0 1.1rem; align-items: flex-start; animation: rise .35s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(.6rem); } to { opacity: 1; transform: none; } }
  .msg .av { width: 2.6rem; height: 2.6rem; flex: none; border-radius: .7rem; background: var(--red); color: #fff3e6;
             display: flex; align-items: center; justify-content: center; font-family: "MaShan", var(--ui); font-size: 1.7rem; }
  .msg .tx { max-width: 82%; padding: .75rem 1.1rem; border-radius: .3rem 1.1rem 1.1rem 1.1rem; font-size: 1.3rem; line-height: 1.7;
             background: #fffdf7; border: 1px solid rgba(140,105,60,.25); box-shadow: 0 .2rem .6rem rgba(90,60,20,.08);
             white-space: pre-wrap; word-break: break-word; }
  .msg.me { flex-direction: row-reverse; }
  .msg.me .av { background: var(--blue); font-family: var(--ui); font-size: 1.05rem; }
  .msg.me .tx { background: var(--blue); color: #fff; border-color: transparent; border-radius: 1.1rem .3rem 1.1rem 1.1rem; }
  .msg.err .tx { background: #fff4ef; border-color: rgba(var(--red-rgb),.35); color: #7a2a20; }
  .cursor { display: inline-block; width: .55em; height: 1em; margin-left: .1em; vertical-align: -.12em; border-radius: 40% 60% 50% 50%;
            background: var(--ink); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .thinking { display: inline-flex; gap: .35rem; padding: .3rem 0; }
  .thinking i { width: .55rem; height: .55rem; border-radius: 50%; background: var(--ink2); opacity: .3; animation: ink 1.2s infinite; }
  .thinking i:nth-child(2) { animation-delay: .2s; } .thinking i:nth-child(3) { animation-delay: .4s; }
  @keyframes ink { 30% { opacity: 1; transform: translateY(-.25rem); } }

  .chips { position: relative; display: flex; gap: .55rem; padding: .3rem 1.4rem .7rem; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { border: 1px solid rgba(var(--red-rgb),.45); background: rgba(255,255,255,.6); color: var(--red); border-radius: 2rem;
          padding: .3rem .85rem; font-size: .95rem; white-space: nowrap; flex: none; transition: background .15s, transform .15s; }
  .chip:hover { background: #fff; transform: translateY(-1px); }
  .chip:disabled { opacity: .45; transform: none; cursor: default; }

  .ask { position: relative; display: flex; gap: .7rem; padding: .9rem 1.4rem 1rem; border-top: 1px dashed rgba(120,90,50,.35); }
  #q { flex: 1; min-width: 0; font-size: 1.3rem; padding: .7rem 1.1rem; border-radius: 1rem; border: 2px solid rgba(120,90,50,.3);
       background: #fffdf8; color: var(--ink); outline: none; }
  #q:focus { border-color: var(--red); box-shadow: 0 0 0 .25rem rgba(var(--red-rgb),.15); }
  #send { flex: none; font-size: 1.3rem; padding: 0 1.5rem; border: 0; border-radius: 1rem; color: #fff8ee; letter-spacing: .1em;
          background: linear-gradient(180deg, #cf4136, var(--red)); box-shadow: 0 .3rem .9rem rgba(var(--red-rgb),.4); }
  #send:disabled { opacity: .5; cursor: default; }
  .foot { position: relative; text-align: center; font-size: .78rem; color: var(--ink2); opacity: .75; padding: 0 1rem .6rem; }

  /* 设置（老师用） */
  .mask { position: fixed; inset: 0; z-index: 9; background: rgba(15,10,25,.6); display: none; align-items: center; justify-content: center; }
  .mask.on { display: flex; }
  .dlg { width: min(92vw, 34rem); max-height: 92vh; overflow-y: auto; background: var(--paper); border-radius: 1.2rem; padding: 1.4rem 1.6rem;
         box-shadow: 0 2rem 5rem rgba(0,0,0,.5); font-size: 1rem; }
  .dlg h3 { margin: 0 0 .3rem; font-family: "MaShan", var(--ui); font-weight: 400; font-size: 1.7rem; }
  .dlg p.note { margin: 0 0 1rem; color: var(--ink2); font-size: .9rem; line-height: 1.6; }
  .dlg label { display: block; margin: .8rem 0 .3rem; font-size: .95rem; color: var(--ink2); }
  .dlg input, .dlg select { width: 100%; font-size: 1rem; padding: .5rem .7rem; border-radius: .6rem; border: 1px solid rgba(120,90,50,.4); background: #fff; }
  .dlg .row { display: flex; gap: .6rem; margin-top: 1.2rem; flex-wrap: wrap; }
  .dlg .row button { font-size: 1rem; padding: .5rem 1.1rem; border-radius: .7rem; border: 1px solid rgba(120,90,50,.4); background: #fff; }
  .dlg .row button.main { background: var(--red); color: #fff; border-color: transparent; }
  #st { margin-top: .8rem; font-size: .9rem; min-height: 1.4em; color: var(--ink2); white-space: pre-wrap; }

  /* 窄框（比如 PPT 里放得小）：人物牌缩到顶上，对话卷占满 */
  @media (max-aspect-ratio: 4/3) {
    .poem { display: none; }
    .who { left: 1.2rem; top: .9rem; } .seal { width: 3rem; height: 3rem; font-size: 2rem; } .who b { font-size: 1.8rem; }
    .scroll { top: 5.2rem; left: 1rem; right: 1rem; bottom: 1rem; width: auto; }
  }
</style>
</head>
<body>
<div class="shade"></div>

<div class="who">
  <div class="seal" id="seal">白</div>
  <div><b id="title">诗仙李白</b><span id="tag">AI 扮演 · 打开就能聊</span></div>
</div>
<div class="poem">日照香炉生紫烟<br>遥看瀑布挂前川<br>飞流直下三千尺<br>疑是银河落九天</div>

<main class="scroll">
  <div class="bar">
    <div class="live"><i class="dot" id="dot"></i><span id="lesson">《望庐山瀑布》</span></div>
    <button class="gear" id="gear" title="设置（老师用）">⚙</button>
  </div>
  <div id="log"></div>
  <div class="chips" id="chips"></div>
  <form class="ask" id="form" autocomplete="off">
    <input id="q" maxlength="200">
    <button id="send" type="submit">问李白</button>
  </form>
  <div class="foot" id="foot"></div>
</main>

<div class="mask" id="mask">
  <div class="dlg">
    <h3>设置（老师用，填一次就行）</h3>
    <p class="note">钥匙只存在这台电脑的浏览器里，不会写进网页文件。学生打开就能直接聊。<br>没有钥匙？看《开通说明》，火山方舟注册后几分钟就能拿到。</p>
    <label>大模型平台</label>
    <select id="prov">
      <option value="ark">火山方舟 · 豆包</option>
      <option value="deepseek">DeepSeek</option>
      <option value="qwen">阿里云百炼 · 通义千问</option>
      <option value="custom">其他（OpenAI 兼容接口）</option>
    </select>
    <label>接口地址</label>
    <input id="url">
    <label>模型名称（Model ID）</label>
    <input id="model">
    <label>API Key（钥匙）</label>
    <input id="key" type="password" placeholder="粘贴到这里">
    <div class="row">
      <button class="main" id="save">保存</button>
      <button id="test">测试一下</button>
      <button id="clear">清空对话</button>
      <button id="close">关闭</button>
    </div>
    <div id="st"></div>
  </div>
</div>

<script src="agent.js"></script>
<script>window.LOCAL_CONFIG = null;</script>
<script src="config.js" onerror="void 0"></script>
<script>
(function () {
  "use strict";
  var A = window.AGENT;
  var PRESETS = {
    ark:      { url: "https://ark.cn-beijing.volces.com/api/v3/chat/completions", model: "doubao-seed-2-0-mini-260215" },
    deepseek: { url: "https://api.deepseek.com/chat/completions", model: "deepseek-chat" },
    qwen:     { url: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions", model: "qwen-plus" },
    custom:   { url: "", model: "" }
  };
  var STORE = "agent-cfg-v1";
  var $ = function (id) { return document.getElementById(id); };

  // 配置优先级：本机浏览器里存的 > 同目录 config.js（只给本地拷贝用，不要上传到网上）> 默认火山方舟
  function loadCfg() {
    var c = null;
    try { c = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) {}
    if (!c && window.LOCAL_CONFIG) c = window.LOCAL_CONFIG;
    c = c || {};
    var p = PRESETS[c.prov] ? c.prov : "ark";
    return { prov: p, url: c.url || PRESETS[p].url, model: c.model || PRESETS[p].model, key: c.key || "", noThink: !!c.noThink };
  }
  var cfg = loadCfg();
  function saveCfg() { try { localStorage.setItem(STORE, JSON.stringify(cfg)); } catch (e) {} }

  // 人物
  document.title = "和" + A.name + "聊一聊";
  $("seal").textContent = A.seal; $("title").textContent = A.title; $("tag").textContent = A.tag;
  $("lesson").textContent = A.lesson; $("q").placeholder = A.placeholder; $("send").textContent = A.sendText;
  $("foot").textContent = A.footer;
  A.chips.forEach(function (t) {
    var b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = t;
    b.onclick = function () { ask(t); }; $("chips").appendChild(b);
  });

  var log = $("log"), history = [], busy = false;
  function add(who, text) {
    var m = document.createElement("div"); m.className = "msg" + (who === "me" ? " me" : "") + (who === "err" ? " err" : "");
    var av = document.createElement("div"); av.className = "av"; av.textContent = who === "me" ? "我" : A.seal;
    var tx = document.createElement("div"); tx.className = "tx"; tx.textContent = text || "";
    m.appendChild(av); m.appendChild(tx); log.appendChild(m); scroll();
    return tx;
  }
  function scroll() { log.scrollTop = log.scrollHeight; }
  function setBusy(b) {
    busy = b; $("send").disabled = b;
    Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (c) { c.disabled = b; });
  }
  function refreshDot() { $("dot").className = "dot" + (cfg.key ? "" : " off"); }
  // 模型偶尔会带 Markdown 记号，课堂上显示成干净的话
  function clean(s) { return s.replace(/\*\*|__|^#+\s*/gm, "").replace(/^\s*[-*]\s+/gm, ""); }

  add("ai", A.welcome);
  refreshDot();

  $("form").onsubmit = function (e) { e.preventDefault(); ask($("q").value); };

  function ask(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    $("q").value = "";
    add("me", text);
    if (!cfg.key) { add("err", "我还没收到老师给的“钥匙”，暂时说不了话。请老师点右上角的齿轮，填一下大模型的 API Key。"); return; }
    var tx = add("ai", "");
    tx.innerHTML = '<span class="thinking"><i></i><i></i><i></i></span>';
    setBusy(true);
    var msgs = [{ role: "system", content: A.system }].concat(history.slice(-A.history * 2), [{ role: "user", content: text }]);
    chat(msgs, function (part) {
      tx.textContent = clean(part); var c = document.createElement("span"); c.className = "cursor"; tx.appendChild(c); scroll();
    }).then(function (full) {
      full = clean(full).trim() || "嗯……我一时想不起来，你再问我一次好吗？";
      tx.textContent = full; scroll();
      history.push({ role: "user", content: text }, { role: "assistant", content: full });
    }).catch(function (err) {
      tx.parentNode.className = "msg err";
      tx.textContent = friendly(err);
    }).then(function () { setBusy(false); $("q").focus(); });
  }

  function friendly(err) {
    var s = String(err && err.status || ""), m = String(err && err.message || err);
    if (s === "401" || s === "403") return "老师给的钥匙好像不对，我进不去门。请老师点齿轮检查 API Key。";
    if (s === "404") return "找不到这位模型先生。请老师点齿轮检查“模型名称”。（" + m + "）";
    if (s === "429") return "问我的人太多啦，我歇一口气，过几秒再问我吧。";
    if (!s) return "山里云雾太大，信没送出去。请检查一下网络，再问我一次。";
    return "出了点小状况（" + s + "）：" + m;
  }

  // 流式调用 OpenAI 兼容接口；豆包默认关掉深度思考，回答更快。不认识这个参数的模型自动去掉重试。
  function chat(messages, onPart) {
    var body = { model: cfg.model, messages: messages, stream: true, temperature: A.temperature, max_tokens: A.maxTokens };
    var think = cfg.prov === "ark" && !cfg.noThink;
    if (think) body.thinking = { type: "disabled" };
    return fetch(cfg.url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cfg.key },
      body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) {
        var msg = t; try { var j = JSON.parse(t); msg = (j.error && (j.error.message || j.error.code)) || j.message || t; } catch (e) {}
        if (think && r.status === 400 && /thinking/i.test(msg)) { cfg.noThink = true; saveCfg(); return chat(messages, onPart); }
        var e2 = new Error(String(msg).slice(0, 160)); e2.status = r.status; throw e2;
      });
      return readStream(r, onPart);
    });
  }
  function readStream(r, onPart) {
    var reader = r.body.getReader(), dec = new TextDecoder("utf-8"), buf = "", full = "";
    function pump() {
      return reader.read().then(function (res) {
        if (res.done) return full;
        buf += dec.decode(res.value, { stream: true });
        var lines = buf.split("\n"); buf = lines.pop();
        lines.forEach(function (ln) {
          ln = ln.trim();
          if (ln.indexOf("data:") !== 0) return;
          var d = ln.slice(5).trim();
          if (d === "[DONE]") return;
          try {
            var j = JSON.parse(d), delta = j.choices && j.choices[0] && j.choices[0].delta;
            if (delta && delta.content) { full += delta.content; onPart(full); }
          } catch (e) {}
        });
        return pump();
      });
    }
    return pump();
  }

  // 设置面板
  function fill() { $("prov").value = cfg.prov; $("url").value = cfg.url; $("model").value = cfg.model; $("key").value = cfg.key; $("st").textContent = ""; }
  function read() {
    var p = $("prov").value;
    if (p !== cfg.prov) cfg.noThink = false;
    cfg.prov = p; cfg.url = $("url").value.trim(); cfg.model = $("model").value.trim(); cfg.key = $("key").value.trim();
  }
  $("gear").onclick = function () { fill(); $("mask").className = "mask on"; };
  $("close").onclick = function () { $("mask").className = "mask"; };
  $("prov").onchange = function () { var p = PRESETS[$("prov").value]; $("url").value = p.url; $("model").value = p.model; };
  $("save").onclick = function () { read(); saveCfg(); refreshDot(); $("st").textContent = "已保存。"; };
  $("clear").onclick = function () { history = []; log.innerHTML = ""; add("ai", A.welcome); $("mask").className = "mask"; };
  $("test").onclick = function () {
    read(); $("st").textContent = "正在连接……";
    var t0 = Date.now(), got = "";
    chat([{ role: "system", content: A.system }, { role: "user", content: "用一句话跟同学们打个招呼。" }], function (p) { got = p; })
      .then(function (full) { saveCfg(); refreshDot(); $("st").textContent = "连通了（" + ((Date.now() - t0) / 1000).toFixed(1) + " 秒），已保存。\n" + A.name + "：" + clean(full); })
      .catch(function (e) { $("st").textContent = "没连上：" + friendly(e); });
  };
  // 老师快捷键：Ctrl+, 打开设置
  document.addEventListener("keydown", function (e) { if (e.ctrlKey && e.key === ",") $("gear").click(); if (e.key === "Escape") $("close").click(); });
})();
</script>
</body>
</html>
